<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Código QR</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr"></script>
</head>
<body>
    <h1>Escáner de Código QR</h1>
    <button id="startButton">Iniciar Cámara</button>
    <video id="video" width="300" height="200" style="border: 1px solid black; display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <p>Escaneado: <span id="result">Nada</span></p>

    <script>
        let video = document.getElementById("video");
        let canvas = document.getElementById("canvas");
        let context = canvas.getContext("2d");
        let resultSpan = document.getElementById("result");
        let startButton = document.getElementById("startButton");
        let scanning = false;

        startButton.addEventListener("click", function () {
            if (!scanning) {
                scanning = true;
                startButton.textContent = "Detener Cámara";
                video.style.display = "block";
                startCamera();
            } else {
                scanning = false;
                startButton.textContent = "Iniciar Cámara";
                video.style.display = "none";
                resultSpan.textContent = "Nada";
                stopCamera();
            }
        });

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(function (stream) {
                    video.srcObject = stream;
                    video.setAttribute("playsinline", true);
                    video.play();
                    scanQRCode();
                })
                .catch(function (err) {
                    console.error("Error al acceder a la cámara: ", err);
                    alert("No se pudo acceder a la cámara.");
                });
        }

        function stopCamera() {
            let stream = video.srcObject;
            if (stream) {
                let tracks = stream.getTracks();
                tracks.forEach(track => track.stop());
            }
            video.srcObject = null;
        }

        function scanQRCode() {
            if (!scanning) return;

            canvas.height = video.videoHeight || 200;
            canvas.width = video.videoWidth || 300;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            let imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            let code = jsQR(imageData.data, canvas.width, canvas.height, {
                inversionAttempts: "attemptBoth",
            });

            if (code) {
                resultSpan.textContent = "QR Detectado: " + code.data;
                scanning = false; // Detenemos el escaneo
                stopCamera();
            } else {
                resultSpan.textContent = "Buscando...";
            }

            if (scanning) {
                requestAnimationFrame(scanQRCode);
            }
        }
    </script>
</body>
</html>
