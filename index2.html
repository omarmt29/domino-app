<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner QR</title>
    <script src="https://unpkg.com/jsqr/dist/jsQR.js"></script>
</head>
<body>
    <h1>Escáner de Código QR</h1>
    <video id="video" width="300" height="200" style="border: 1px solid black;"></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <p>Escaneado: <span id="result">Nada</span></p>

    <script>
        let video = document.getElementById("video");
        let canvas = document.getElementById("canvas");
        let context = canvas.getContext("2d");
        let resultSpan = document.getElementById("result");

        // Acceso a la cámara
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(function (stream) {
                video.srcObject = stream;
                video.setAttribute("playsinline", true); // Requerido para iOS
                video.play();
                scanQRCode();
            })
            .catch(function (err) {
                console.error("Error al acceder a la cámara: ", err);
            });

        // Función para escanear el QR
        function scanQRCode() {
            canvas.height = video.videoHeight;
            canvas.width = video.videoWidth;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            let imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            let code = jsQR(imageData.data, canvas.width, canvas.height, {
                inversionAttempts: "dontInvert",
            });

            if (code) {
                resultSpan.textContent = code.data;
            } else {
                resultSpan.textContent = "Nada";
            }

            requestAnimationFrame(scanQRCode); // Llama a la función de nuevo para hacer escaneo continuo
        }
    </script>
</body>
</html>
